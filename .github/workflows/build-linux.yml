name: Build Linux release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Node SEA engine (Linux x64)
        run: npm run build:exe:linux

      - name: Package AppImage and deb
        run: npm run dist:linux

      - name: Show artifacts
        run: ls -lh release

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 release/*.AppImage release/*.deb --clobber
