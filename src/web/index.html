<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sbridge · 任务看板</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/vendor/diff2html.min.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="7.8" cy="9.2" r="2.6"/>
          <circle cx="20.2" cy="18.8" r="2.6" opacity=".58"/>
          <path d="M10 10.5c3.6 0 3.1 5.3 7.6 6.6" opacity=".92"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>sbridge</strong>
        <span>会话接力工作台</span>
      </div>
    </div>

    <button class="btn-primary" id="btn-new-task">＋ 新建任务</button>
    <button class="btn-ghost" id="btn-discover" title="扫描 Codex / Pi / Claude 的会话目录，按项目目录自动归组导入">自动获取项目</button>

    <div class="tree" id="tree"></div>

    <div class="mini-board" id="mini-board">
      <div class="group-label"><span>会话链 · 当前任务</span><button class="link-btn" id="btn-board-view">白板视图</button></div>
      <div id="mini-chain"><div class="empty-tree">选择任务后显示接力链</div></div>
    </div>

    <div class="sidebar-foot">
      <div class="foot-row">
        <button class="btn-ghost" id="btn-settings" title="打开会话自动启动终端等偏好设置">设置</button>
        <button class="btn-ghost theme-toggle" id="btn-theme" title="切换浅色 / 深色主题">🌙</button>
        <button class="btn-ghost" id="btn-support" title="赞助支持 sbridge 持续更新" hidden>♥ 支持</button>
      </div>
      <div class="hint">数据保存在 data/board.json</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="sess-tabs" id="sess-tabs"></div>
      <button class="proj-chip" id="proj-chip" title="项目现状（git / 磁盘）：这里能看到不受工具限制的改动" hidden></button>
      <div class="actions" id="task-actions" hidden>
        <button class="btn-ghost" id="btn-search" title="全局搜索会话（Ctrl+K）">🔍 搜索</button>
        <button class="btn-ghost" id="btn-board-view2" title="查看完整白板">▦ 白板</button>
        <button class="btn-ghost" id="btn-split" aria-pressed="false" title="左右分屏显示两个会话">◫ 分屏</button>
        <span class="split-control" id="split-right-wrap" hidden>
          <span>右侧</span>
          <select class="split-select" id="split-right" aria-label="右侧会话"></select>
        </span>
        <!-- 新开会话：空任务发起第一场对话（选工具+目录，内嵌终端） -->
        <button class="btn-ghost" id="btn-launch" title="在这个任务里用 Pi / Codex / Claude 开一场全新对话">▶ 新开会话</button>
        <button class="btn-ghost" id="btn-attach" title="把本机已有的 CLI 会话接进看板">↧ 接入已有会话</button>
      </div>
      <button class="btn-ghost" id="btn-panel" aria-pressed="false" title="面板（Ctrl+B）：改动 / 文件 / 上下文 / Worktree">⋯</button>
    </header>

    <section class="workspace">
      <!-- 完整白板视图（侧栏「白板视图」或顶栏按钮切换） -->
      <div class="board-wrap" id="board-wrap" hidden>
        <div class="empty" id="empty">
          <div class="empty-icon">◇</div>
          <h2>这里是一块白板</h2>
          <p>任务下的每个会话以卡片铺开；接力生成的新会话自动连线成链。</p>
        </div>
        <div class="board" id="board">
          <svg class="edges" id="edges"></svg>
          <div class="cards" id="cards"></div>
        </div>
      </div>
      <div class="board-hint" id="board-hint" hidden>左键框选 · 右键拖动白板 · 双击打开 · 右键卡片操作</div>
      <!-- 会话面板区（主战场） -->
      <div class="pane-area" id="pane-area">
        <div class="workspace-empty" id="ws-empty">
          <div class="empty-icon">⌨</div>
          <h2>选择或新建一个会话</h2>
          <p>点侧栏「会话链」里的卡片，或顶栏「接入已有会话」。</p>
        </div>
      </div>
      <!-- 右侧面板：内容跟随当前聚焦会话，和工作轨迹/终端切换互不影响 -->
      <div class="sp-resizer" id="sp-resizer" hidden title="拖动调整面板宽度"></div>
      <aside class="side-panel" id="side-panel" hidden aria-label="右侧面板">
        <div class="sp-head">
          <div class="sp-tabs" id="sp-tabs"></div>
          <button type="button" class="sp-add" id="sp-add" title="打开面板" aria-label="打开面板">＋</button>
          <span class="sp-head-grow"></span>
          <button type="button" class="btn-icon sp-expand" id="sp-expand" aria-label="放大面板" title="放大面板"></button>
          <button class="btn-icon" id="sp-close" aria-label="关闭面板">×</button>
        </div>
        <div class="sp-body" id="sp-body"></div>
      </aside>
    </section>
  </main>
</div>

<div class="modal-mask" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">对话框</h2>
      <button class="btn-icon" id="btn-close-modal" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!-- 前端模块按依赖顺序加载（普通脚本，顶层声明在全局词法环境共享）；
         xterm 由 term.js 在首次打开终端时按需加载，首屏不解析 -->
    <script src="/vendor/highlight.min.js"></script>
    <script src="/vendor/diff2html-ui-slim.min.js"></script>
    <script src="/js/core.js"></script>
    <script src="/js/term.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/stream.js"></script>
    <script src="/js/interactions.js"></script>
    <script src="/js/pane.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/board.js"></script>
    <script src="/js/tasks.js"></script>
    <script src="/js/modals.js"></script>
    <script src="/js/handoff.js"></script>
    <script src="/js/sidepanel.js"></script>
    <script src="/js/actions.js"></script>
    <script src="/app.js"></script>
</body>
</html>
